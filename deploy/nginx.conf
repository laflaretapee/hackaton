# Install on the host after certbot webroot certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name ai-buddy.85.159.231.99.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/ai-buddy-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai-buddy.85.159.231.99.sslip.io;
    ssl_certificate /etc/letsencrypt/live/ai-buddy.85.159.231.99.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-buddy.85.159.231.99.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Do not deny embedding here: Telegram Mini App must be allowed in Telegram.
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 190s;
    }
}
